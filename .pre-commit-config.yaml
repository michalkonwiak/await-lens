repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=500"]

      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: check-case-conflict
      - id: detect-private-key
      - id: debug-statements
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # Project-local tools, installed and locked by uv
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff — lint
        entry: uv run --locked --no-sync ruff check
        language: system
        types_or: [python, pyi]

      - id: ruff-format
        name: Ruff — format
        entry: uv run --locked --no-sync ruff format
        language: system
        types_or: [python, pyi]
